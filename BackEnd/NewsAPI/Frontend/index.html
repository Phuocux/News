<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>News</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
}

.container{
    width:800px;
    margin:auto;
}

.news{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:6px;
}

.title{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Danh sách bài báo</h1>

<div id="newsList"></div>

<br>
<a href="create-news.html">➕ Tạo bài báo</a>

</div>

<script>

fetch("https://localhost:5001/api/news")
.then(res => res.json())
.then(result => {

    const list = result.data;
    const container = document.getElementById("newsList");

    list.forEach(news => {

        container.innerHTML += `
        <div class="news">
            <div class="title">
                <a href="news.html?id=${news.id}">
                    ${news.title}
                </a>
            </div>

            <div>${news.summary ?? ""}</div>

            <small>${new Date(news.createdAt).toLocaleString()}</small>
        </div>
        `;
    });

});

</script>

</body>
</html>
